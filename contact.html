<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us</title>
    <style>
        body {
            margin: 0;
            font-family: 'Poppins', sans-serif;
            background: url(images/mainback.jpg) no-repeat center center fixed;
            background-size: cover;
            color: white;
            height: 100vh;
        
            display: flex;
            flex-direction: column;
        }
        header {
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 20px 10px;
            background-color: rgba(0, 0, 0, 0.8);
            position: fixed;
            width: 100%;
            z-index: 100;
        }

        .logo {
            font-size: 2rem;
            font-weight: bold;
            color: #FF7400;
        }

        nav ul {
            list-style: none;
            display: flex;
            gap: 20px;
            margin: 0;
            padding: 0;
        }

        nav ul li {
            display: inline;
        }

        nav ul li a {
            text-decoration: none;
            color: #fff;
            font-weight: 600;
            padding: 10px 15px;
            border: 1px solid transparent;
            transition: 0.3s;
        }

        nav ul li a:hover {
            border: 1px solid #FF7400;
            border-radius: 5px;
        }
        .container {
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            height: 100%;
            padding-top: 100px;
            text-align: center;
            background-color: rgba(0, 0, 0, 0.6);
            width: 100%;
            gap: 20px;
        }
        h1 {
            font-size: 3rem;
            margin-bottom: 0px;
            color: #FF7400;
        }
        h2 {
            font-size: 3rem;
            margin-bottom: 0px;
            color: #FF7400;
            }
        h3 {
            font-size: 3rem;
            margin-bottom: 0px;
            color: #FF7400;
        }
        p {
            font-size: 3rem;
            line-height: 1.5;
            margin: 5px 0;
        }
        .hours {
            margin-top: 20px;
        }
        footer {
            text-align: center;
            padding: 20px 0;
            background-color: rgba(0, 0, 0, 0.8);
            color: #fff;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        footer p{
            font-size: 16px;

        }
    </style>
</head>
<body>
    <header>
        <div class="logo">Fire Food Restaurant</div>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="menu.html">Menu</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="contact.html">Contacts</a></li>
            </ul>
        </nav>
    </header>
    <div class="container">
        <div>
            <h1>ADDRESS</h1>
            <p>Brīvības bulvāris 30, Rīga</p>
        </div>
        <div class="hours">
            <h2>WORKING HOURS</h2>
            <p>Monday-Friday: 10.00 - 21.00</p>
            <p>Saturday-Sunday: 11.00 - 22.00</p>
        </div>
        <div>
            <h3>CONTACTS</h3>
            <p>Phone Number: +371 20 282 821</p>
        </div>
    </div>
   <footer>
    <p> © 2025 Fire Food. All Rights Reserved.</p>
   </footer>
</body>
</html>
